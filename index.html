<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head style="padding: 0px">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>最即時的大眾運輸比較系統</title>
  <script type="text/javascript" src="http://www.google.com/jsapi"></script>
  <script src="//d3js.org/d3.v3.min.js"></script>
  <script src="https://maps.googleapis.com/maps/api/js?sensor=false&language=zh-TW"></script>
  <script src="http://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_week.geojsonp"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="StyleSheet1.css" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="icon" href="images/icon.png" />
</head>
<body>

  <!-- Header -->
  <section id="header">
    <header>

      <p>
        <img style="height: 300px; width: auto" src="images/logo.png" />
      </p>
      <h1>第三隊</h1>
      <p>今天解決不了的事 別急明天也解決不了 你媽知道你在這邊參加超狂的黑克松嗎</p>
      <p>李映澤 楊昌憲 王昱程</p>
    </header>
    <footer>
      <a href="#banner" class="button style2 scrolly-middle">往下開始</a>
    </footer>
  </section>

  <!-- Banner -->
  <section id="banner">
    <header>
      <h2>請選擇《起點》與《終點》</h2>
    </header>
    <p>(限定大台北地區捷運站)</p>

    <div id="element" style="width: 50%; margin: 0 auto;">
      <p id="showMe">
        <button onclick="geoFindMe()" class="button style2 scrolly">自動偵測目前位置(超級準)</button>
      </p>
      <div id="out"></div>
      <table align="center">
        <tr>
          <td colspan="1" class="label">起點：</td>
          <td colspan="3" style="vertical-align: middle; border-radius: 25px; background: transparent;">
            <select id="start" class="submit"></select>
          </td>
          <td colspan="1">
            <button onclick="choiceStation()">點圖選站(測試中)</button>
          </td>
        </tr>
        <tr>
          <td colspan="1"></td>
          <td colspan="3">
            <input class="submit changeButton" id="change" type="button" value="⇅" />
          </td>
        </tr>
        <tr>
          <td colspan="1" class="label">終點：</td>
          <td colspan="3" style="vertical-align: middle; border-radius: 25px; background: transparent;">
            <select id="end" class="submit"></select>
          </td>
        </tr>
      </table>
    </div>

    <footer>
      <a id="search" href="#first" class="button style2 scrolly">幫我比一比</a>
    </footer>
  </section>

  <!-- Feature 1 -->
  <article id="first" class="container box style1 right">
    <div class="image fit" style="background-image: url(images/pic01.jpg); background-size: 100% 100%;">
      <!--<img class="image fit" src="images/pic01.jpg" alt="" />-->
      <header>
        <h2 style="text-align: center; margin-top: 2em;">泡泡比一比<br />
        </h2>
      </header>
      <p id="label1" class="label_P"></p>
      <p id="P1" style="text-align: center;"></p>

      <p id="label2" class="label_P"></p>
      <p id="P2" style="text-align: center;"></p>

      <p id="label3" class="label_P"></p>
      <p id="P3" style="text-align: center;"></p>
    </div>


    <div class="inner">
      <header>
        <h2>超級比一比<br />
        </h2>
      </header>
      <p id="walk"></p>
      <p id="bus"></p>
      <p id="mrt"></p>
    </div>
  </article>

  <!-- Feature 2 -->
  <article class="container box style1 left">
    <!-- <img class="image fit" src="images/pic02.jpg" alt="" />-->
    <div class="image fit" style="background-image: url(images/pic02.jpg); background-size: 100% 100%; height: 300px;">
      <p id="word" style="position: absolute; color: #E3E616; padding-left: 15%; z-index: 999"></p>
      <div id="img" style="height: 100%; width: 100%; margin: 0px auto; opacity: 0.3;">
      </div>

    </div>
    <div class="inner">
      <header>
        <h2>走路減碳動ㄘ動</h2>
        <p>請排序您最為考量的因素</p>
        <input type="radio" name="location" value="money" onclick="radioChange(this)" />最省錢
        <input type="radio" name="location" value="time" onclick="radioChange(this)" />最省時
        <input type="radio" name="location" value="distance" onclick="radioChange(this)" />走最短
      </header>
    </div>

    <a class="scrollup" href="#">
      <div style="width: 100%; height: 100%">Scroll</div>
    </a>
  </article>



  <!-- Scripts -->
  <script src="assets/js/jquery.min.js"></script>
  <script src="assets/js/jquery.scrolly.min.js"></script>
  <script src="assets/js/jquery.poptrox.min.js"></script>
  <script src="assets/js/skel.min.js"></script>
  <script src="assets/js/util.js"></script>
  <script src="assets/js/main.js"></script>

</body>

<script src="JavaScript1.js"></script>
</html>
