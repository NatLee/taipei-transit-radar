name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Weekly rebuild so the site picks up new and changed bus routes (Monday 03:17 Taipei time).
  schedule:
    - cron: '17 19 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the bus network from the Taipei e-bus feed
        run: npm run data:bus
      - name: Build the site
        run: npm run build
        env:
          # A project site lives under /<repo-name>/; derive it so a rename needs no edit here.
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
